version: "3.8"

services:
  whisparr:
    build:
      context: .
      dockerfile: Dockerfile
    image: whisparr:custom
    container_name: whisparr-custom
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
      - /path/to/media:/media  # Update this path
      - /path/to/downloads:/downloads  # Update this path
    ports:
      - "6969:6969"
    restart: unless-stopped
